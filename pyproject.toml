[project]
name = "crucible-upload-ui"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "crucible-ingestion",
    "flask>=3.0",
    "h5py>=3.0",
    "nano-crucible>=3.2.1",
    "prefect>=3.6.25",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
crucible-ingestion = { git = "https://github.com/MolecularFoundryCrucible/crucible-ingestion", rev = "TEMP-test-print-barcode-wrapper" }
nano-crucible = { git = "https://github.com/MolecularFoundryCrucible/nano-crucible", rev = "print-barcode-wrapper" }
