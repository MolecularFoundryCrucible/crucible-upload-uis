<div class="card h-100 shadow-sm" style="border-top-color: #6f42c1;">
  <div class="card-body d-flex flex-column">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <h5 class="card-title mb-0" style="color:#6f42c1;">XRD Assignment</h5>
      <span id="xrd-spinner" class="spinner-border spinner-border-sm text-secondary d-none" role="status"></span>
    </div>

    <!-- Mode selector -->
    <div class="btn-group btn-group-sm mb-3" role="group">
      <input type="radio" class="btn-check" name="xrd-mode" id="xrd-mode-single" value="single" checked autocomplete="off"
             onchange="xrdOnModeChange()">
      <label class="btn btn-outline-secondary" for="xrd-mode-single">Single Sample</label>
      <input type="radio" class="btn-check" name="xrd-mode" id="xrd-mode-file" value="file" autocomplete="off"
             onchange="xrdOnModeChange()">
      <label class="btn btn-outline-secondary" for="xrd-mode-file">From File</label>
      <input type="radio" class="btn-check" name="xrd-mode" id="xrd-mode-parent" value="parent" autocomplete="off"
             onchange="xrdOnModeChange()">
      <label class="btn btn-outline-secondary" for="xrd-mode-parent">From Parent</label>
    </div>

    <!-- From Parent: parent UUID input + resolve -->
    <div id="xrd-parent-fields" class="d-none mb-3">
      <label class="form-label small fw-semibold">Parent Sample UUID</label>
      <div class="input-group input-group-sm">
        <input id="xrd-parent-uuid" type="text" class="form-control font-monospace"
               placeholder="Parent sample UUID" />
        <button class="btn btn-outline-secondary" type="button" onclick="xrdResolveParent()">
          <span id="xrd-spinner-resolve" class="spinner-border spinner-border-sm d-none me-1" role="status"></span>
          Resolve
        </button>
      </div>
    </div>

    <p id="xrd-empty-msg" class="text-muted small">Browse and select a file above, then assign samples below.</p>

    <!-- Assignment area (shared by all modes, built dynamically) -->
    <div id="xrd-assignment-area" class="d-none flex-grow-1 overflow-auto">
      <table class="table table-sm table-bordered align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th style="width:60px;">Pos.</th>
            <th>Sample Name</th>
            <th>UUID</th>
          </tr>
        </thead>
        <tbody id="xrd-rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  // XRD panel state — isolated to avoid conflicts with nirvana globals
  let _xrdMode = 'single';   // 'single' | 'file' | 'parent'
  let _xrdParentUuid = '';

  function _getMode() {
    const el = document.querySelector('input[name="xrd-mode"]:checked');
    return el ? el.value : 'single';
  }

  window.xrdOnModeChange = function () {
    _xrdMode = _getMode();
    const isParent = _xrdMode === 'parent';
    document.getElementById('xrd-parent-fields').classList.toggle('d-none', !isParent);
    _xrdClear();

    // If mode is single or file and files already selected, re-parse
    if (_xrdMode !== 'parent' && state.selectedPaths && state.selectedPaths.length > 0) {
      const instrument = document.getElementById('instrument').value;
      parseAssignmentFiles(instrument, state.selectedPaths);
    }
  };

  window.xrdResolveParent = function () {
    const parentUuid = document.getElementById('xrd-parent-uuid').value.trim();
    if (!parentUuid) { showStatus('Enter a parent sample UUID first.', 'warning'); return; }

    document.getElementById('xrd-spinner-resolve').classList.remove('d-none');
    _xrdClear();

    fetch('/api/resolve_children', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({sample_uuid: parentUuid}),
    })
      .then(r => r.json().then(d => ({ok: r.ok, d})))
      .then(({ok, d}) => {
        if (!ok) { showStatus(d.error || 'Failed to resolve children.', 'danger'); return; }
        const children = d.children || [];
        if (!children.length) { showStatus('No child samples found for this UUID.', 'warning'); return; }

        _xrdParentUuid = parentUuid;

        // Build one synthetic _maAssignment entry per selected file (or a placeholder)
        const paths = (state.selectedPaths && state.selectedPaths.length)
          ? state.selectedPaths : [''];
        _maAssignments = paths.map(p => ({
          path: p,
          basename: p ? p.split(/[\\/]/).pop() : '(no file)',
          source: 'parent',
          parent_sample: parentUuid,
          samples: children.map((c, i) => ({
            position: `S${String(i+1).padStart(2,'0')}`,
            name: c.sample_name,
            uuid: c.unique_id,
            excluded: false,
          })),
        }));
        _xrdRenderRows(_maAssignments[0].samples, /*readonly=*/true);
        document.getElementById('xrd-empty-msg').classList.add('d-none');
        document.getElementById('xrd-assignment-area').classList.remove('d-none');
      })
      .catch(e => showStatus('Resolve error: ' + e.message, 'danger'))
      .finally(() => document.getElementById('xrd-spinner-resolve').classList.add('d-none'));
  };

  function _xrdClear() {
    _maAssignments = [];
    _xrdParentUuid = '';
    document.getElementById('xrd-rows').innerHTML = '';
    document.getElementById('xrd-assignment-area').classList.add('d-none');
    document.getElementById('xrd-empty-msg').classList.remove('d-none');
    document.getElementById('xrd-empty-msg').textContent =
      _getMode() === 'parent'
        ? 'Enter a parent UUID above and click Resolve.'
        : 'Browse and select a file above, then assign samples below.';
  }

  function _xrdRenderRows(samples, readonly) {
    const tbody = document.getElementById('xrd-rows');
    tbody.innerHTML = '';
    samples.forEach((s, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="text-muted small font-monospace">${s.position}</td>
        <td class="small">${s.name || '—'}</td>
        <td>
          <input type="text" class="form-control form-control-sm font-monospace"
                 value="${s.uuid}"
                 ${readonly ? 'readonly style="background:#e9ecef;"' : ''}
                 onchange="_maAssignments[0] && (_maAssignments[0].samples[${i}].uuid = this.value)" />
        </td>`;
      tbody.appendChild(tr);
    });
  }

  // Called by the main index.html whenever files are parsed (multi_assignment mode)
  // We hook into _buildNirvanaTabs by overriding it for this instrument only.
  const _origBuild = window._buildNirvanaTabs;
  window._buildNirvanaTabs = function () {
    const instrument = document.getElementById('instrument').value;
    if (instrument !== 'inorganic_xrd') { _origBuild && _origBuild(); return; }

    if (!_maAssignments.length) return;
    const fileObj = _maAssignments[0];  // XRD always shows the first file's samples
    const readonly = _xrdMode === 'parent';

    // For "from file" / "single": set parent_sample to null (no parent available)
    if (!readonly) fileObj.parent_sample = null;

    _xrdRenderRows(fileObj.samples, readonly);
    document.getElementById('xrd-empty-msg').classList.add('d-none');
    document.getElementById('xrd-assignment-area').classList.remove('d-none');
  };

  // Also override _clearNirvanaUI for XRD
  const _origClear = window._clearNirvanaUI;
  window._clearNirvanaUI = function () {
    const instrument = document.getElementById('instrument').value;
    if (instrument !== 'inorganic_xrd') { _origClear && _origClear(); return; }
    _xrdClear();
  };
})();
</script>
