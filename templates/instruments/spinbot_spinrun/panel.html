<div class="card h-100 shadow-sm">
  <div class="card-body">
    <h5 class="card-title text-primary mb-1">Run Metadata</h5>
    <p class="text-muted small mb-3">Optional — attach the run's deposition log .yaml file alongside the .h5</p>

    <label class="form-label fw-semibold">deposition log .yaml</label>
    <div class="input-group mb-1">
      <input id="spinrun-yaml-path" type="text" class="form-control" readonly
             placeholder="No file selected" style="background:#e9ecef;" />
      <button class="btn btn-outline-secondary" type="button" onclick="spinrunBrowseYaml()">Browse…</button>
      <button class="btn btn-outline-secondary" type="button" onclick="spinrunClearYaml()" title="Clear">&#x2715;</button>
    </div>
    <div class="form-text">The .h5 file above is required; this is an optional companion file.</div>
  </div>
</div>

<script>
(function () {
  window._instrumentPanelClearers = window._instrumentPanelClearers || {};
  window._instrumentExtraFiles = window._instrumentExtraFiles || {};

  let _spinrunYamlPath = '';

  function _spinrunClear() {
    _spinrunYamlPath = '';
    document.getElementById('spinrun-yaml-path').value = '';
  }

  window._instrumentPanelClearers['spinbot_spinrun'] = _spinrunClear;
  window._instrumentExtraFiles['spinbot_spinrun'] = () => _spinrunYamlPath ? [_spinrunYamlPath] : [];

  window.spinrunBrowseYaml = async function () {
    try {
      const res = await fetch('/api/browse');
      const data = await res.json();
      if (!res.ok) { showStatus(data.error || 'Browse failed.', 'danger'); return; }
      const paths = data.paths || [];
      if (!paths.length) return;
      _spinrunYamlPath = paths[0];
      document.getElementById('spinrun-yaml-path').value = _spinrunYamlPath;
    } catch (e) {
      showStatus('Browse error: ' + e.message, 'danger');
    }
  };

  window.spinrunClearYaml = _spinrunClear;
})();
</script>
